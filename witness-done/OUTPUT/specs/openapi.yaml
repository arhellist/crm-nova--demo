openapi: 3.1.0
info:
  title: NOVA CRM — reporting API (read-only)
  version: 1.0.0
  description: |
    Контур отчётности: только чтение агрегатов с логической реплики PostgreSQL.
    Запись в систему выполняется исключительно через Supabase (PostgREST/RPC) и здесь не описана.
    Любой write-метод возвращает 405.
servers:
  - url: https://reports.nova-crm.example
    description: production (TLS, приватный контур, доступ по токену)
  - url: http://127.0.0.1:8080
    description: локальный контур (docker compose)
security:
  - bearerAuth: []
paths:
  # Внешний контракт Supabase PostgREST: чтение доменных таблиц. Видимость строк решает
  # RLS (objects_select/tasks_select), а не backend; запись и удаление здесь не описаны,
  # потому что грантов на них нет (INV-001, INV-002).
  /rest/v1/objects:
    get:
      operationId: postgrestListObjects
      summary: Список объектов через PostgREST (RLS)
      security:
        - userJwt: []
      parameters:
        - { name: select, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: string }, description: Не используется; пагинация курсорная }
      responses:
        "200":
          description: Массив видимых неархивированных объектов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ObjectRow" }
        "401":
          description: Нет или истёк JWT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: postgrestCreateObject
      summary: Создать объект (только manager, RLS)
      security:
        - userJwt: []
      parameters:
        - { name: select, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectInput" }
      responses:
        "201":
          description: Созданный объект
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ObjectRow" }
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Нет прав (RLS/гранты)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: postgrestUpdateObject
      summary: Изменить объект (только manager, RLS)
      security:
        - userJwt: []
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectInput" }
      responses:
        "200":
          description: Изменённые строки; пустой массив означает «нет прав/не найдено»
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ObjectRow" }
        "403":
          description: Нет прав
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /rest/v1/tasks:
    get:
      operationId: postgrestListTasks
      summary: Список задач через PostgREST (RLS)
      security:
        - userJwt: []
      parameters:
        - { name: select, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: assignee_id, in: query, schema: { type: string, format: uuid } }
        - { name: order, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Массив видимых неархивированных задач (manager — все, executor — свои)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskRow" }
        "401":
          description: Нет или истёк JWT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: postgrestCreateTask
      summary: Создать задачу (только manager, RLS)
      description: |
        Статус не передаётся: БД ставит `new`, автора — `auth.uid()`.
        Исполнитель должен иметь роль `executor`, объект — быть активным.
      security:
        - userJwt: []
      parameters:
        - { name: select, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: Созданная задача
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskRow" }
        "400":
          description: Ошибка валидации или доменного правила (P0400/P0422)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Нет прав (RLS/гранты, P0403/42501)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: postgrestUpdateTask
      summary: Изменить поля задачи (только manager, RLS)
      description: |
        `status` не входит в тело: смена статуса — только `rpc.change_task_status`.
        Смена `assignee_id` разрешена только в статусах `new` и `rework`, иначе P0422.
      security:
        - userJwt: []
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "200":
          description: Изменённые строки; пустой массив означает «нет прав/не найдено»
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskRow" }
        "400":
          description: Доменное правило (P0400/P0422)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Нет прав
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  # Supabase Auth (GoTrue): внешний контракт, используемый фронтендом D04.
  /auth/v1/token:
    post:
      operationId: authSignIn
      summary: Вход по email и паролю (grant_type=password)
      description: |
        Supabase Auth; при включённом TOTP сессия остаётся на aal1 и требует шага MFA.
        Открытая регистрация отключена, поэтому signup-эндпоинт в контракт не входит.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordGrantInput" }
      responses:
        "200":
          description: Сессия aal1 и токены
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokenResponse" }
        "400":
          description: Неверный email или пароль без деталей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /rest/v1/profiles:
    get:
      operationId: postgrestListProfiles
      summary: Профиль текущего пользователя (RLS)
      security:
        - userJwt: []
      parameters:
        - { name: select, in: query, schema: { type: string } }
        - { name: id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Массив видимых профилей
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfileRow" }
        "401":
          description: Нет или истёк JWT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/v1/factors:
    post:
      operationId: authMfaChallenge
      summary: Запрос/проверка второго фактора TOTP
      description: Supabase Auth MFA; код не логируется и не передаётся в URL.
      security:
        - userJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaChallengeInput" }
      responses:
        "200":
          description: Фактор подтверждён, сессия повышена до aal2
        "400":
          description: Неверный или просроченный код
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  # Write-контур Supabase: единственный путь смены статуса и архивирования (ADR-0002).
  # Функции объявлены в схеме public, поэтому PostgREST отдаёт их по маршруту /rpc/.
  /rest/v1/rpc/change_task_status:
    post:
      operationId: rpcChangeTaskStatus
      summary: Сменить статус задачи
      description: |
        security definer-функция; матрица переходов и роль проверяются в БД (INV-003).
        Ошибки: P0400 — задача не найдена/архивирована, P0403 — нет прав,
        P0422 — переход запрещён или отсутствует комментарий возврата.
      security:
        - userJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeTaskStatusInput" }
      responses:
        "200":
          description: Новый статус задачи
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [new, in_progress, on_review, rework, accepted] }
        "400":
          description: P0400/P0403/P0422 без SQL-деталей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /rest/v1/rpc/archive_task:
    post:
      operationId: rpcArchiveTask
      summary: Архивировать задачу (только manager, идемпотентно)
      security:
        - userJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdInput" }
      responses:
        "204": { description: Задача архивирована или уже была архивирована }
        "400":
          description: P0400/P0403 без SQL-деталей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /rest/v1/rpc/archive_object:
    post:
      operationId: rpcArchiveObject
      summary: Архивировать объект (только manager, идемпотентно)
      security:
        - userJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectIdInput" }
      responses:
        "204": { description: Объект архивирован или уже был архивирован }
        "400":
          description: P0400/P0403 без SQL-деталей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /health:
    get:
      operationId: getHealth
      summary: Живость процесса
      security: []
      responses:
        "200":
          description: Процесс жив
          content:
            application/json:
              schema:
                type: object
                required: [status, uptime_s]
                properties:
                  status: { type: string, const: ok }
                  uptime_s: { type: number, minimum: 0 }
  /health/replication:
    get:
      operationId: getReplicationHealth
      summary: Состояние подписки и лаг репликации
      responses:
        "200":
          description: Подписка в состоянии streaming
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationStatus" }
        "503":
          description: Лаг выше порога или подписка не работает
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationStatus" }
  /metrics:
    get:
      operationId: getMetrics
      summary: Метрики Prometheus (только внутренняя сеть)
      responses:
        "200":
          description: Текст метрик
          content:
            text/plain:
              schema: { type: string }
  /api/reports/objects:
    get:
      operationId: getObjectsReport
      summary: Сводка по объектам и статусам задач
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Агрегаты по объектам
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ObjectReportRow" }
        "503":
          $ref: "#/components/responses/ReplicaLag"
  /api/reports/workload:
    get:
      operationId: getWorkloadReport
      summary: Загрузка исполнителей
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Агрегаты по исполнителям
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/WorkloadRow" }
        "503":
          $ref: "#/components/responses/ReplicaLag"
  /api/reports/status-ages:
    get:
      operationId: getStatusAgesReport
      summary: Сроки пребывания задачи на проверке
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Агрегаты по дням
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/StatusAgeRow" }
        "503":
          $ref: "#/components/responses/ReplicaLag"
components:
  securitySchemes:
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Пользовательский JWT Supabase; роль берётся из profiles, не из claim
    bearerAuth:
      type: http
      scheme: bearer
      description: API_TOKEN из менеджера секретов; не пользовательский JWT
  parameters:
    From:
      name: from
      in: query
      required: false
      schema: { type: string, format: date }
      description: Начало периода (календарные сутки Europe/Moscow)
    To:
      name: to
      in: query
      required: false
      schema: { type: string, format: date }
      description: Конец периода включительно
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    ReplicaLag:
      description: Данные отчёта временно недоступны
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    PasswordGrantInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    AuthTokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string }
        expires_in: { type: integer }
        user:
          type: object
          required: [id, email]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
    MfaChallengeInput:
      type: object
      required: [factor_id, code]
      properties:
        factor_id: { type: string, format: uuid }
        challenge_id: { type: string }
        code: { type: string, pattern: "^[0-9]{6}$" }
    ObjectInput:
      type: object
      required: [title, address]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        address: { type: string, minLength: 1, maxLength: 300 }
      additionalProperties: false
    ProfileRow:
      type: object
      required: [id, full_name, role]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string, maxLength: 120 }
        role: { type: string, enum: [manager, executor] }
    ChangeTaskStatusInput:
      type: object
      required: [p_task_id, p_target]
      properties:
        p_task_id: { type: string, format: uuid }
        p_target: { type: string, enum: [new, in_progress, on_review, rework, accepted] }
        p_comment: { type: string, maxLength: 2000, nullable: true }
    IdInput:
      type: object
      required: [p_task_id]
      properties:
        p_task_id: { type: string, format: uuid }
    ObjectIdInput:
      type: object
      required: [p_object_id]
      properties:
        p_object_id: { type: string, format: uuid }
    ObjectRow:
      type: object
      required: [id, title, address, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 300 }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
    TaskInput:
      type: object
      required: [object_id, title, assignee_id]
      properties:
        object_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        assignee_id: { type: string, format: uuid }
      additionalProperties: false
    TaskRow:
      type: object
      required: [id, object_id, title, assignee_id, author_id, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        object_id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        assignee_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        status: { type: string, enum: [new, in_progress, on_review, rework, accepted] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
    ReplicationStatus:
      type: object
      required: [status, lag_seconds]
      properties:
        status: { type: string, enum: [streaming, lagging, broken] }
        lag_seconds: { type: number, minimum: 0 }
        last_error: { type: [string, "null"] }
    Envelope:
      type: object
      required: [source, lag_seconds, generated_at, data]
      properties:
        source: { type: string, const: replica }
        lag_seconds: { type: number, minimum: 0 }
        generated_at: { type: string, format: date-time }
        data: { type: array }
    ObjectReportRow:
      type: object
      required: [object_id, title, tasks_total, accepted_share]
      properties:
        object_id: { type: string, format: uuid }
        title: { type: string }
        address: { type: string }
        tasks_total: { type: integer, minimum: 0 }
        tasks_new: { type: integer, minimum: 0 }
        tasks_in_progress: { type: integer, minimum: 0 }
        tasks_on_review: { type: integer, minimum: 0 }
        tasks_rework: { type: integer, minimum: 0 }
        tasks_accepted: { type: integer, minimum: 0 }
        accepted_share: { type: number, minimum: 0, maximum: 100 }
        last_activity_at: { type: [string, "null"], format: date-time }
    WorkloadRow:
      type: object
      required: [assignee_id, full_name, tasks_total]
      properties:
        assignee_id: { type: string, format: uuid }
        full_name: { type: string }
        tasks_total: { type: integer, minimum: 0 }
        tasks_in_progress: { type: integer, minimum: 0 }
        tasks_on_review: { type: integer, minimum: 0 }
        tasks_rework: { type: integer, minimum: 0 }
        tasks_accepted: { type: integer, minimum: 0 }
        oldest_open_at: { type: [string, "null"], format: date-time }
    StatusAgeRow:
      type: object
      required: [day, avg_seconds_in_status]
      properties:
        day: { type: string, format: date }
        avg_seconds_in_status: { type: number, minimum: 0 }
        max_seconds_in_status: { type: number, minimum: 0 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - E_VALIDATION
                - E_UNAUTHORIZED
                - E_FORBIDDEN_ORIGIN
                - E_NOT_FOUND
                - E_METHOD_NOT_ALLOWED
                - E_RATE_LIMITED
                - E_REPLICA_LAG
                - E_REPLICA_DOWN
                - E_INTERNAL
            message: { type: string }
            request_id: { type: string }
